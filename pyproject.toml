[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-radar"
version = "0.1.0"
description = "Hourly monitor for foundation-model releases"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "vbarter" }]
dependencies = ["PyYAML>=6.0.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
model-radar = "model_radar.cli:main"

[tool.setuptools.packages.find]
include = ["model_radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
